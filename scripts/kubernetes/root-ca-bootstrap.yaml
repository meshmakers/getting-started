# Bootstrap of a fresh local root CA. Applied only when no persisted CA exists in
# .ca/ - otherwise om-install.ps1 seeds the local-root-ca-tls secret from those
# files instead, so the CA (and therefore host/browser trust) survives reinstalls.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-root-ca
  namespace: cert-manager
spec:
  isCA: true
  # Distinct CN so trust/untrust never collides with the octo-tools dev cluster CA.
  commonName: OctoMesh Getting Started Root CA
  secretName: local-root-ca-tls
  duration: 87600h          # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io

# CA ClusterIssuer named exactly as in the managed environments (mm-cloud-issuer),
# so chart values stay portable. Signs with the root CA in local-root-ca-tls, which
# is either bootstrapped by root-ca-bootstrap.yaml or restored from .ca/ by
# om-install.ps1.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mm-cloud-issuer
spec:
  ca:
    secretName: local-root-ca-tls

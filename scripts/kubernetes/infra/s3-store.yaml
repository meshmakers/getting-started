# S3-compatible object store (SeaweedFS "mini": master, volume server, filer and S3 gateway in
# one process) for the archive COPY TO / COPY FROM staging area (AB#5967, AB#5490).
# The bot and CrateDB reach it through the cluster name  seaweedfs.octo-infra:8333  (plain http,
# protocol = 'http' in a COPY statement); from the host it is  http://localhost:8333
# (kind-cluster.yaml maps NodePort 30333).
#
# The credentials are NOT part of this manifest: om-install.ps1 generates them once and creates the
# Secret  seaweedfs-s3  (keys accessKey, secretKey, s3.json). Anonymous requests are refused, the
# store only answers signed requests.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: octo-infra
  labels: { app: seaweedfs }
spec:
  clusterIP: None
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-ext
  namespace: octo-infra
spec:
  type: NodePort
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: 8333, nodePort: 30333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: octo-infra
spec:
  serviceName: seaweedfs
  replicas: 1
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata: { labels: { app: seaweedfs } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - "mini"
            - "-dir=/data"
            - "-bucket=octo-artifacts"
            - "-s3.config=/etc/seaweedfs-s3/s3.json"
            - "-webdav=false"
            - "-admin.ui=false"
            - "-s3.port.iceberg=0"
            - "-s3.port.lance=0"
            # Bound the memory of in-flight GET buffers (default 0 = unlimited): a multi-GB object
            # streamed back out otherwise buffers without limit and the pod is OOM-killed.
            - "-s3.readerCacheSizeMB=256"
          env:
            # Go soft memory limit: makes the garbage collector hold the heap below the container
            # limit (4Gi) instead of letting it grow with every large read.
            - { name: GOMEMLIMIT, value: "2560MiB" }
          ports:
            - { containerPort: 8333, name: s3 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-credentials, mountPath: /etc/seaweedfs-s3, readOnly: true }
          resources:
            requests: { memory: 1Gi }
            limits: { memory: 4Gi }
          # The S3 port answers 403 to unsigned requests, so a TCP probe is the readiness signal.
          readinessProbe:
            tcpSocket: { port: 8333 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: s3-credentials
          secret:
            secretName: seaweedfs-s3
            items:
              - { key: s3.json, path: s3.json }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
